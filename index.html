<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stat Blocks">
<title>Stat Blocks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <nav class="tabs" role="tablist">
      <button data-act="tab" data-tab="encounter" class="tab">Encounter</button>
      <button data-act="tab" data-tab="library" class="tab">Library</button>
      <button data-act="tab" data-tab="help" class="tab">Help</button>
    </nav>
    <div class="toggles">
      <div class="seg" id="modeSeg" aria-label="Mode">
        <button data-act="mode" data-mode="play">Play</button>
        <button data-act="mode" data-mode="edit">Edit</button>
      </div>
      <div class="seg" id="advSeg" aria-label="d20 mode">
        <button data-act="adv" data-adv="dis" title="Disadvantage">Dis</button>
        <button data-act="adv" data-adv="normal" title="Normal">Normal</button>
        <button data-act="adv" data-adv="adv" title="Advantage">Adv</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <main id="main"></main>
  <aside id="log" class="log">
    <div class="log-head">
      <button class="log-title" data-act="toggleLog">Rolls <span id="logCaret">▴</span></button>
      <button class="link" data-act="clearLog">Clear</button>
    </div>
    <div id="logBody" class="log-body"></div>
  </aside>
</div>

<div id="dropOverlay" class="drop-overlay"><div>Drop stat block .json files to import</div></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" multiple hidden>

<script src="app.js"></script>
</body>
</html>
